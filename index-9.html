<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onam festival — Aravind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #120b08;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,214,133,0.14);
    --gold: #f3b23e;
    --gold-soft: #ffd685;
    --maroon: #a3293b;
    --leaf: #3f6a4a;
    --cream: #f6ecda;
    --muted: #b6a58a;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding: 0 0 60px 0;
    overflow-x:hidden;
  }

  .bg{
    position:fixed;
    inset:-40px;
    background-image:url('cover.png');
    background-size:cover;
    background-position:center;
    filter: blur(60px) brightness(0.35) saturate(1.4);
    transform: scale(1.15);
    z-index:-2;
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(18,11,8,0.4) 0%, rgba(18,11,8,0.85) 60%, rgba(18,11,8,1) 100%);
  }

  .page{
    width:100%;
    max-width: 480px;
    padding: 40px 22px 0 22px;
  }

  /* ---------- Hero ---------- */
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 34px;
  }

  .cover-art{
    width: 240px;
    height: 240px;
    border-radius: 18px;
    overflow:hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,214,133,0.18);
    margin-bottom: 22px;
  }
  .cover-art img{
    width:100%; height:100%; object-fit:cover; display:block;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    font-weight:700;
    color: var(--gold);
    text-transform:uppercase;
    margin-bottom: 8px;
  }

  .album-title{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 34px;
    line-height:1.1;
    background: linear-gradient(180deg, #fff8ea 0%, var(--gold-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom: 6px;
  }

  .artist{
    font-size: 15px;
    font-weight:600;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .sub-meta{
    font-size: 12px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .sub-meta .dot{ width:3px; height:3px; border-radius:50%; background:var(--muted); }

  /* ---------- Tracklist ---------- */
  .tracklist{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .track{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 16px 16px 18px 16px;
    backdrop-filter: blur(14px);
  }

  .track-top{
    display:flex;
    align-items:center;
    gap:14px;
  }

  /* pookalam ring play button */
  .play-btn{
    position:relative;
    width:54px;
    height:54px;
    flex:0 0 54px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:
      radial-gradient(circle at center, #1b120c 0 38%, transparent 39%),
      conic-gradient(
        var(--gold) 0deg 30deg, var(--maroon) 30deg 60deg,
        var(--leaf) 60deg 90deg, var(--gold) 90deg 120deg,
        var(--maroon) 120deg 150deg, var(--leaf) 150deg 180deg,
        var(--gold) 180deg 210deg, var(--maroon) 210deg 240deg,
        var(--leaf) 240deg 270deg, var(--gold) 270deg 300deg,
        var(--maroon) 300deg 330deg, var(--leaf) 330deg 360deg
      );
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin 14s linear infinite paused;
  }
  .play-btn.playing{ animation-play-state: running; }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .play-btn svg{
    width:18px; height:18px;
    fill: var(--cream);
    position:relative;
    z-index:1;
    margin-left: 2px;
  }
  .play-btn.playing svg{ margin-left:0; }

  .track-info{ flex:1; min-width:0; }

  .track-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 16.5px;
    color: var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .track-meta{
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .preview-tag{ opacity:0.7; }

  .time{
    font-size:11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex:0 0 auto;
  }

  .progress-wrap{
    margin-top: 12px;
    padding: 6px 0;
    cursor:pointer;
  }
  .progress-track{
    height:4px;
    border-radius:4px;
    background: rgba(255,255,255,0.12);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--maroon), var(--gold));
    border-radius:4px;
  }

  .dl-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top: 14px;
    width:100%;
    padding: 11px 14px;
    border-radius: 999px;
    background: rgba(243,178,62,0.08);
    border: 1px solid rgba(243,178,62,0.35);
    color: var(--gold-soft);
    font-size: 12.5px;
    font-weight:700;
    letter-spacing: 0.4px;
    text-decoration:none;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .dl-btn:active{ transform: scale(0.98); }
  .dl-btn svg{ width:13px; height:13px; fill: var(--gold-soft); }

  .footer{
    text-align:center;
    margin-top: 30px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .play-btn{ animation: none !important; }
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">

  <div class="hero">
    <div class="cover-art"><img src="cover.png" alt="Onam festival album cover"></div>
    <div class="eyebrow">Album</div>
    <div class="album-title">Onam festival</div>
    <div class="artist">Aravind</div>
    <div class="sub-meta"><span id="track-count">2 tracks</span><span class="dot"></span><span>Hi-Res Lossless</span></div>
  </div>

  <div class="tracklist" id="tracklist"></div>

  <div class="footer">Happy Onam 2026 🌺</div>
</div>

<script>
  // ---- Add / edit tracks here ----
  // "file" must match the exact filename you upload to this folder on GitHub.
  const tracks = [
    { title: "Onam Remix v5", file: "onam-remix-v5.mp3", downloadUrl: "https://drive.usercontent.google.com/download?id=1P9Vkxv53IxzTiyr41V0mxtTMsO2Gkmse&export=download&confirm=t", meta: "FLAC · 24-bit Hi-Res" },
    { title: "Onam Remix v4", file: "onam-remix-v4.mp3", downloadUrl: "https://drive.usercontent.google.com/download?id=1CMjST5G17Vtyb-V_Xw4uSNkNYLAR9KG9&export=download&confirm=t", meta: "FLAC · 24-bit Hi-Res" }
  ];

  const listEl = document.getElementById('tracklist');
  document.getElementById('track-count').textContent = tracks.length + (tracks.length === 1 ? ' track' : ' tracks');

  const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

  function fmt(t){
    if(!isFinite(t)) return "0:00";
    const m = Math.floor(t/60);
    const s = Math.floor(t%60).toString().padStart(2,'0');
    return m + ":" + s;
  }

  let activeAudio = null;

  tracks.forEach((track, i) => {
    const el = document.createElement('div');
    el.className = 'track';
    el.innerHTML = `
      <div class="track-top">
        <button class="play-btn" aria-label="Play ${track.title}">${playIcon}</button>
        <div class="track-info">
          <div class="track-name">${track.title}</div>
          <div class="track-meta">${track.meta}<span class="preview-tag"> · streaming preview</span></div>
        </div>
        <div class="time">0:00</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>
      <a class="dl-btn" href="${track.downloadUrl}" download>
        <svg viewBox="0 0 24 24"><path d="M12 3v10.5m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
        Download as HI-RES Lossless
      </a>
    `;
    listEl.appendChild(el);

    const audio = new Audio(encodeURI(track.file));
    audio.preload = 'none';

    const btn = el.querySelector('.play-btn');
    const timeEl = el.querySelector('.time');
    const fill = el.querySelector('.progress-fill');
    const progressWrap = el.querySelector('.progress-wrap');

    btn.addEventListener('click', () => {
      if(activeAudio && activeAudio !== audio){
        activeAudio.pause();
      }
      if(audio.paused){
        audio.play();
        activeAudio = audio;
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      btn.classList.add('playing');
      btn.innerHTML = pauseIcon;
      document.querySelectorAll('.track').forEach(t => { if(t!==el) t.querySelector('.play-btn').classList.remove('playing'); });
    });
    audio.addEventListener('pause', () => {
      btn.classList.remove('playing');
      btn.innerHTML = playIcon;
    });
    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      fill.style.width = pct + '%';
      timeEl.textContent = fmt(audio.duration - audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
      timeEl.textContent = fmt(audio.duration);
    });
    audio.addEventListener('ended', () => {
      btn.classList.remove('playing');
      btn.innerHTML = playIcon;
      fill.style.width = '0%';
      timeEl.textContent = fmt(audio.duration);
    });

    progressWrap.addEventListener('click', (e) => {
      const rect = progressWrap.querySelector('.progress-track').getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if(isFinite(audio.duration)) audio.currentTime = pct * audio.duration;
    });
  });
</script>

</body>
</html>
